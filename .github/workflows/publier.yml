name: publier

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publier-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controle:
    name: controle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests
        run: python3 -m unittest discover -s scripts -v
      - name: Lire les vraies sources, sans signer
        run: python3 scripts/generer.py --no-compute --output "$RUNNER_TEMP/site/v2"

  grub:
    name: grub
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Outils de construction
        run: sudo apt-get install -y --no-install-recommends bison flex gawk gcc-aarch64-linux-gnu
      - name: Vérifier l'archive GNU et construire
        run: python3 scripts/grub.py build --output "$RUNNER_TEMP/grub"

  construire:
    name: construire
    if: github.event_name != 'pull_request'
    needs: [controle, grub]
    runs-on: ubuntu-24.04
    # A new Windows image is downloaded whole to compute its hash.
    timeout-minutes: 240
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Outils de construction de GRUB
        run: sudo apt-get install -y --no-install-recommends bison flex gawk gcc-aarch64-linux-gnu
      - name: Générer
        run: >-
          python3 scripts/generer.py --grub --output site/v2
          --previous https://catalog.bonk-os.app/v2/catalog.json
      - name: Signer et relire la signature
        env:
          CLE: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          fichier=$(mktemp)
          printf '%s\n' "$CLE" > "$fichier"
          openssl pkeyutl -sign -rawin -inkey "$fichier" -in site/v2/catalog.json -out site/v2/catalog.json.sig
          rm -f "$fichier"
          openssl pkeyutl -verify -rawin -pubin -inkey keys/courante.pub.pem -in site/v2/catalog.json -sigfile site/v2/catalog.json.sig
      - name: Signaler les sources en échec
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/signaler.py site/failures.json
          python3 scripts/signaler.py site/v2/updates.json "Nouvelles versions hors du catalogue"
      - name: Retirer le rapport du site
        run: rm -f site/failures.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publication:
    name: publication
    if: github.event_name != 'pull_request'
    needs: construire
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  menage:
    name: menage
    needs: publication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Garder les trois derniers déploiements
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/deployments?environment=github-pages&per_page=100" --jq '.[].id' \
            | tail -n +4 \
            | while read -r id; do
                gh api -X POST "repos/$GH_REPO/deployments/$id/statuses" -f state=inactive > /dev/null
                gh api -X DELETE "repos/$GH_REPO/deployments/$id"
              done

  relecture:
    name: relecture
    if: github.event_name != 'pull_request'
    needs: publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Relire la signature depuis l'adresse publique
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o catalog.json https://catalog.bonk-os.app/v2/catalog.json
          curl -fsSL --retry 5 --retry-all-errors -o catalog.json.sig https://catalog.bonk-os.app/v2/catalog.json.sig
          openssl pkeyutl -verify -rawin -pubin -inkey keys/courante.pub.pem -in catalog.json -sigfile catalog.json.sig
      - name: Relire GRUB depuis l'adresse publique
        run: python3 scripts/grub.py check-published
